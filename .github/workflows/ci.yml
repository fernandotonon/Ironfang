# Ironfang CI: desktop build + tests on Linux, WebAssembly build + deploy directory.
# Mirrors Clayground's own workflow (aqtinstall + emsdk pins) so both stay in step.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  QT_VERSION: '6.11.1'
  QT_MODULES: 'qtmultimedia qtquick3d qtquick3dphysics qtquicktimeline qtshadertools qt5compat qtimageformats'
  EMSDK_VERSION: '4.0.7'
  CMAKE_BUILD_TYPE: Release

jobs:
  desktop-linux:
    name: desktop (ubuntu, gcc_64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: ${{ env.QT_MODULES }}
          cache: true
      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libssl-dev \
            libpulse-dev libasound2-dev libxcb-cursor0 libvulkan-dev
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --target ironfang -j"$(nproc)"
      - name: Tests (headless)
        run: |
          # ctest needs the Clayground QML plugins; the qml suites and the app smoke test run offscreen
          cmake --build build -j"$(nproc)"
          QT_QPA_PLATFORM=offscreen ctest --test-dir build -R "ironfang|Ironfang" --output-on-failure --timeout 180

  wasm:
    name: webassembly (wasm_multithread)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v16
        with: { version: '${{ env.EMSDK_VERSION }}' }
      - name: Install Qt (host)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: ${{ env.QT_MODULES }}
          cache: true
          dir: ${{ runner.temp }}/qt-host
      - name: Install Qt (wasm)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: all_os
          target: wasm
          arch: wasm_multithread
          modules: 'qtmultimedia qtquick3d qtquicktimeline qtshadertools qt5compat qtimageformats'
          cache: true
      - name: Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build + deploy directory
        env:
          QT_HOST_ROOT: ${{ runner.temp }}/qt-host/Qt/${{ env.QT_VERSION }}/gcc_64
        run: |
          export QT_WASM_ROOT="$QT_ROOT_DIR"
          export EMSDK="$EMSDK"
          # build-wasm.sh sources emsdk_env.sh and calls the kit's qt-cmake
          sed -i 's/sysctl -n hw.ncpu 2>\/dev\/null || nproc/nproc/' scripts/build-wasm.sh
          scripts/build-wasm.sh
      - name: Size report
        run: |
          W=deploy/multithread/ironfang.wasm
          echo "### Ironfang web build" >> "$GITHUB_STEP_SUMMARY"
          echo "| raw | gzip -9 |" >> "$GITHUB_STEP_SUMMARY"; echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| $(du -h $W | cut -f1) | $(gzip -9 -c $W | wc -c | awk '{printf "%.1f MB", $1/1048576}') |" >> "$GITHUB_STEP_SUMMARY"
          echo "assets: $(du -sh deploy/multithread/assets | cut -f1), $(find deploy/multithread/assets -type f | wc -l) files" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ironfang-web
          path: deploy/multithread
          retention-days: 14
